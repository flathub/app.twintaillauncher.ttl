id: app.twintaillauncher.ttl

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: twintaillauncher
finish-args:
  # Use x11 socket not fallback-x11 because of Honkai StarRail cutscenes wanting pure x11 socket
  - --socket=x11
  # Use wayland socket so stuff game steamdeck gaming mode can work properly and many other stuff
 # - --socket=wayland
  # Audio access so games can have audio
  - --socket=pulseaudio
  # Controlers
  - --device=all
  # Tauri IPC
  - --share=ipc
  # Download stuff from network
  - --share=network
  # System tray icon
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=org.kde.StatusNotifierWatcher
  # Opening stuff in file managers
  - --talk-name=org.freedesktop.FileManager1
  # Folder pickers
  - --talk-name=org.freedesktop.FileChooser
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # Wine needs devel access
  - --allow=devel
  - --allow=multiarch
  # Pressure vessel
  - --allow=per-app-dev-shm
  # Steamdeck controler navigation
  - --filesystem=/run/udev:ro
  # Discord rich presence
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # https://docs.flatpak.org/en/latest/sandbox-permissions.html#external-drive-access
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Steam shortcuts and reading steam runners
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam
  # Desktop shortcuts
  - --filesystem=~/.local/share/applications
  # Gamescope access
  - --filesystem=xdg-run/gamescope-0:rw
  # Access lutris storage so users can import their installs
  - --filesystem=~/.local/share/lutris:rw
  # MangoHud configs
  - --filesystem=~/.config/MangoHud:ro
  # https://github.com/flathub/net.lutris.Lutris/blob/beta/net.lutris.Lutris.yml#L29
  - --env=PATH=/app/bin:/usr/bin:/app/utils/bin:/usr/lib/extensions/vulkan/MangoHud/bin/:/usr/lib/extensions/vulkan/gamescope/bin
  # For Steam Deck HDR support and many others
  - --env=LD_LIBRARY_PATH=/usr/lib/extensions/vulkan/gamescope/lib
  # Pressure Vessel (https://github.com/flathub/com.valvesoftware.Steam/commit/0538256facdb0837c33232bc65a9195a8a5bc750)
  - --env=XDG_DATA_DIRS=/app/share:/usr/lib/extensions/vulkan/share:/usr/share:/usr/share/runtime/share:/run/host/user-share:/run/host/share:/usr/lib/pressure-vessel/overrides/share:/app/lib/extensions/vulkan/MangoHud/share
  # Copied from https://github.com/flathub/com.valvesoftware.Steam/blob/beta/com.valvesoftware.Steam.yml
  - --env=TZ=
  - --unset-env=TZ
  - --env=LC_ADDRESS=C
  - --env=LC_COLLATE=C
  - --env=LC_MONETARY=C
  - --env=LC_MEASUREMENT=C
  - --env=LC_NAME=C
  - --env=LC_NUMERIC=C
  - --env=LC_TELEPHONE=C
#  - --env=ALSA_CONFIG_PATH=
#  - --unset-env=ALSA_CONFIG_PATH
#  - --env=MESA_GLSL_CACHE_DIR=
#  - --unset-env=MESA_GLSL_CACHE_DIR
  - --env=STEAM_RUNTIME_PREFER_HOST_LIBRARIES=
  - --unset-env=STEAM_RUNTIME_PREFER_HOST_LIBRARIES
#  - --env=STEAM_RUNTIME=
#  - --unset-env=STEAM_RUNTIME
#  - --env=SDL_VIDEODRIVER=
#  - --unset-env=SDL_VIDEODRIVER
  - --env=DBUS_FATAL_WARNINGS=0
  - --env=PROTON_DEBUG_DIR=/var/tmp
#  - --env=XDG_CONFIG_DIRS=/etc/xdg:/usr/lib/x86_64-linux-gnu/GL:/usr/lib/i386-linux-gnu/GL
  - --env=GST_PLUGIN_SYSTEM_PATH=/app/lib/gstreamer-1.0:/app/lib32/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/i386-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/lib/i386-linux-gnu/gstreamer-1.0

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin

modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - name: pnpm
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - install -Dm755 pnpm /app/bin/pnpm
    sources:
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v10.13.1/pnpm-linuxstatic-x64
        sha256: 67d1ca4bc720829cbfb5684073740cd13b0fa89e393ae8b10ade546892140a3b
        dest-filename: pnpm
        only-arches: [x86_64]
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v10.13.1/pnpm-linuxstatic-arm64
        sha256: c74cf42216832441967b56c3e17ae1d0171662706ba3a09bad6fadb51ec362aa
        dest-filename: pnpm
        only-arches: [aarch64]
  # We need to ship our own gamescope for user convinience and better control using our app settings, really not a fan of this workaround but its way more user friendly
  - name: gamescope
    build-options:
      prefix: /app/lib/extensions/vulkan/gamescope
      libdir: /app/lib/extensions/vulkan/gamescope/lib
      prepend-path: /app/lib/extensions/vulkan/gamescope/bin
      prepend-pkg-config-path: /app/lib/extensions/vulkan/gamescope/lib/pkgconfig
      ldflags: -Wl,-rpath=/app/lib/extensions/vulkan/gamescope/lib
      env:
        C_INCLUDE_PATH: /app/lib/extensions/vulkan/gamescope/include
        CPLUS_INCLUDE_PATH: /app/lib/extensions/vulkan/gamescope/include
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
      - /share/pkgconfig
      - /share/applications
      - /bin/di-edid-decode
    buildsystem: meson
    config-opts:
      - -Dpipewire=enabled
      - -Dforce_fallback_for=stb,wlroots,libliftoff,vkroots
      - -Denable_tests=false
    post-install:
      - mv /app/lib/extensions/vulkan/gamescope/bin/gamescope /app/lib/extensions/vulkan/gamescope/bin/gamescope-brokey
    sources:
      - type: git
        url: https://github.com/ValveSoftware/gamescope.git
        commit: 17baf4abd1ab3353fb705e4d0d023f84e870f7e8
        tag: 3.16.25
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          is-main-source: true
      - type: archive
        url: https://github.com/nothings/stb/archive/5736b15f7ea0ffb08dd38af21067c314d6a3aae9/stb.tar.gz
        sha256: d00921d49b06af62aa6bfb97c1b136bec661dd11dd4eecbcb0da1f6da7cedb4c
        dest: subprojects/stb
        x-checker-data:
          type: html
          url: https://raw.githubusercontent.com/ValveSoftware/gamescope/refs/heads/master/subprojects/stb.wrap
          version-pattern: revision\s*=\s*([a-f0-9]+)
          url-template: https://github.com/nothings/stb/archive/$version/stb.tar.gz
      - type: archive
        url: https://github.com/g-truc/glm/archive/0af55ccecd98d4e5a8d1fad7de25ba429d60e863/glm.tar.gz
        sha256: e7f187d83523f505eb38dd25d297ea6c0d4ed856d733e808f18253f5a8fa88a0
        dest: subprojects/glm
        x-checker-data:
          type: html
          url: https://raw.githubusercontent.com/ValveSoftware/gamescope/refs/heads/master/subprojects/glm.wrap
          version-pattern: revision\s*=\s*([a-f0-9]+)
          url-template: https://github.com/g-truc/glm/archive/$version/glm.tar.gz
      - type: shell
        commands:
          - echo -n 'Checking stb version ' && grep 5736b15f7ea0ffb08dd38af21067c314d6a3aae9
            subprojects/stb.wrap
          - echo -n 'Checking glm version ' && grep 0af55ccecd98d4e5a8d1fad7de25ba429d60e863
            subprojects/glm.wrap
          - meson subprojects packagefiles --apply
    modules:
      - name: hwdata
        config-opts:
          - --datarootdir=${FLATPAK_DEST}/share
        sources:
          - type: archive
            url: https://github.com/vcrhonek/hwdata/archive/v0.409/hwdata-0.409.tar.gz
            sha256: 23006accc0f931dd5187d0307a57d0744e2b8feb85e73c37bc0f5229fb31eadd
            x-checker-data:
              type: anitya
              project-id: 5387
              stable-only: true
              url-template: https://github.com/vcrhonek/hwdata/archive/v$version/hwdata-$version.tar.gz
        post-install:
          - mkdir -p -m 755 ${FLATPAK_DEST}/lib/pkgconfig
          - install -m 644 ${FLATPAK_DEST}/share/pkgconfig/hwdata.pc ${FLATPAK_DEST}/lib/pkgconfig/
        cleanup:
          - /lib/pkgconfig
          - /lib/modprobe.d
          - /share/aclocal
          - /share/pkgconfig
      - name: mtdev
        buildsystem: autotools
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2
            sha256: a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e
            x-checker-data:
              type: anitya
              project-id: 8868
              stable-only: true
              url-template: https://bitmath.org/code/mtdev/mtdev-$version.tar.bz2
          - type: shell
            commands:
              - cp -p /usr/share/automake-*/config.{sub,guess} config-aux/
        cleanup:
          - /bin
          - /include
          - /lib/*.la
          - /lib/pkgconfig
      - name: libinput
        buildsystem: meson
        config-opts:
          - --libexec=lib
          - -Dlibwacom=false
          - -Ddebug-gui=false
          - -Dtests=false
          - -Ddocumentation=false
          - -Dzshcompletiondir=no
        sources:
          - type: archive
            url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.31.3/libinput-1.31.3.tar.gz
            sha256: b6749bf6f1890f6631c0a70a027c35fec9d2e096a39f720548896e41474a9854
            x-checker-data:
              type: anitya
              project-id: 5781
              stable-only: true
              url-template: https://gitlab.freedesktop.org/libinput/libinput/-/archive/$version/libinput-$version.tar.gz
        cleanup:
          - /bin
          - /etc
          - /lib/libinput
          - /lib/udev
          - /share
          - /include
          - /lib/pkgconfig
      - name: seatd
        buildsystem: meson
        config-opts:
          - -Dlibseat-logind=disabled
          - -Dlibseat-seatd=enabled
          - -Dlibseat-builtin=disabled
          - -Dserver=disabled
          - -Dexamples=disabled
          - -Dman-pages=disabled
        sources:
          - type: archive
            url: https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz
            sha256: 302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96
            x-checker-data:
              type: anitya
              project-id: 234932
              stable-only: true
              url-template: https://git.sr.ht/~kennylevinsen/seatd/archive/$version.tar.gz
        cleanup:
          - /include
          - /lib/pkgconfig
      - name: xwayland
        buildsystem: meson
        config-opts:
          - -Dsecure-rpc=false
        sources:
          - type: archive
            url: https://xorg.freedesktop.org/archive/individual/xserver/xwayland-24.1.12.tar.xz
            sha256: 6df02c511b92c1b9848734d9d1b03a4c24f8375ba3cada44e9684a21b5f78e21
            x-checker-data:
              type: anitya
              project-id: 180949
              stable-only: true
              url-template: https://xorg.freedesktop.org/archive/individual/xserver/xwayland-$version.tar.xz
        cleanup:
          - /lib/xorg
          - /lib/pkgconfig
          - /share
        modules:
          - name: fontutil
            buildsystem: autotools
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/releases/individual/font/font-util-1.4.2.tar.xz
                sha256: 02e4f8afdcf03cc8372ca9c37aa104b1e36b47722dbc79531be08f0a4c622999
                x-checker-data:
                  type: anitya
                  project-id: 15055
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/releases/individual/font/font-util-$version.tar.xz
            cleanup:
              - '*'
          - name: libXres
            buildsystem: autotools
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/releases/individual/lib/libXres-1.2.3.tar.gz
                sha256: e1ee4845aa6a59e6ba7145422279ffc7da521b4d3dd302c0b1febdf45d06d093
                x-checker-data:
                  type: anitya
                  project-id: 1790
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/releases/individual/lib/libXres-$version.tar.gz
            cleanup:
              - /include
              - /lib/*.la
              - /lib/pkgconfig
              - /share/man
          - name: libxcvt
            buildsystem: meson
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/releases/individual/lib/libxcvt-0.1.3.tar.xz
                sha256: a929998a8767de7dfa36d6da4751cdbeef34ed630714f2f4a767b351f2442e01
                x-checker-data:
                  type: anitya
                  project-id: 235147
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/releases/individual/lib/libxcvt-$version.tar.xz
            cleanup:
              - /bin
              - /include
              - /lib/pkgconfig
              - /share/man
          - name: libxfont2
            buildsystem: autotools
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/releases/individual/lib/libXfont2-2.0.7.tar.xz
                sha256: 8b7b82fdeba48769b69433e8e3fbb984a5f6bf368b0d5f47abeec49de3e58efb
                x-checker-data:
                  type: anitya
                  project-id: 17165
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/releases/individual/lib/libXfont2-$version.tar.xz
            cleanup:
              - /include
              - /lib/*.la
              - /lib/pkgconfig
            modules:
              - name: libfontenc
                buildsystem: autotools
                config-opts:
                  - --disable-static
                sources:
                  - type: archive
                    url: https://xorg.freedesktop.org/releases/individual/lib/libfontenc-1.1.9.tar.xz
                    sha256: 9d8392705cb10803d5fe1d27d236cbab3f664e26841ce01916bbbe430cf273e2
                    x-checker-data:
                      type: anitya
                      project-id: 1613
                      stable-only: true
                      url-template: https://xorg.freedesktop.org/releases/individual/lib/libfontenc-$version.tar.xz
                cleanup:
                  - /include
                  - /lib/*.la
                  - /lib/pkgconfig
      - name: luajit
        no-autogen: true
        make-args:
          - BUILDMODE=dynamic
          - PREFIX=${FLATPAK_DEST}
        make-install-args:
          - PREFIX=${FLATPAK_DEST}
        sources:
          - type: git
            url: https://github.com/openresty/luajit2.git
            tag: v2.1-20260724
            commit: 982cd8323eafd8604a9e5f2a916aa50b9f67d9ed
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.-]+)$
              stable-only: false
        cleanup:
          - /bin
          - /include
          - /lib/pkgconfig
          - /share/man
      - name: xmu
        buildsystem: autotools
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://www.x.org/archive/individual/lib/libXmu-1.3.1.tar.xz
            sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4
        cleanup:
          - /include
          - /lib/*.la
          - /lib/*.a
          - /share
          - /lib/pkgconfig
  - name: gamescope-wrapper
    buildsystem: simple
    build-commands:
      - install -Dm755 gamescope /app/lib/extensions/vulkan/gamescope/bin/gamescope
    sources:
      - type: script
        dest-filename: gamescope
        commands:
          - |
            #!/usr/bin/env bash
            LD_LIBRARY_PATH=/app/lib/extensions/vulkan/gamescope/lib:$LD_LIBRARY_PATH
            PATH=/app/lib/extensions/vulkan/gamescope/bin:$PATH:/app/lib/extensions/vulkan/MangoHud/bin
            exec gamescope-brokey "$@"
  # https://github.com/flathub/net.lutris.Lutris/blob/beta/net.lutris.Lutris.yml#L290C1-L315C31
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-examples=false
      - -Dwith-util=false
      - -Dwith-sd-bus-provider=no-daemon
    post-install:
      - install -Dm0775 -t /app/bin ../data/gamemoderun
      - ln -sf /app/lib/libgamemode.so.0.0.0 /app/lib/libgamemode.so.0
      - ln -sf /app/lib/libgamemodeauto.so.0.0.0 /app/lib/libgamemodeauto.so.0
    sources:
      - type: archive
        url: https://github.com/FeralInteractive/gamemode/releases/download/1.8.2/gamemode-1.8.2.tar.xz
        sha256: 98cd1bcf6101c92fe87f974c7776af23c7e18f29ce6ecfe572b1c39dcde5c181
        x-checker-data:
          type: anitya
          project-id: 17410
          stable-only: true
          url-template: https://github.com/FeralInteractive/gamemode/releases/download/$version/gamemode-$version.tar.xz
  # We need to ship our own mangohud for user convinience and better control using our app settings, really not a fan of this workaround but its way more user friendly
  - name: MangoHud
    buildsystem: meson
    build-options:
      prefix: /app/lib/extensions/vulkan/MangoHud
      libdir: /app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu
      prepend-path: /app/lib/extensions/vulkan/MangoHud/bin
      prepend-pkg-config-path: /app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu/pkgconfig
      ldflags: -Wl,-rpath=/app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu
      env:
        FLATPAK_LIBDIR: /app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu
        C_INCLUDE_PATH: /app/lib/extensions/vulkan/MangoHud/include
        CPLUS_INCLUDE_PATH: /app/lib/extensions/vulkan/MangoHud/include
    cleanup:
      - /include
      - /share/cmake
      - /share/doc
      - /share/man
      - /share/pkgconfig
      - /lib/*/pkgconfig
      - /lib/*/cmake
      - /lib/*/*.a
      - /lib/*/*.la
    config-opts:
      - -Dmangoapp=true
      - -Dappend_libdir_mangohud=false
      - -Dmangoplot=disabled
    sources:
      - type: archive
        url: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.3/MangoHud-v0.8.3-Source.tar.xz
        sha256: e810ac73163468533ddb7c74b681f1de4992a3d785dce294fee9933ec8956b05
    modules:
      - name: libNVCtrl
        buildsystem: simple
        no-autogen: true
        no-make-install: true
        build-commands:
          - make
          - install -d /app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu
          - cp -a libXNVCtrl.so* /app/lib/extensions/vulkan/MangoHud/lib/x86_64-linux-gnu
          - install -d /app/lib/extensions/vulkan/MangoHud/include/NVCtrl
          - install -D *.h /app/lib/extensions/vulkan/MangoHud/include/NVCtrl
        subdir: src/libXNVCtrl
        sources:
          - type: archive
            archive-type: tar
            url: https://api.github.com/repos/NVIDIA/nvidia-settings/tarball/refs/tags/470.63.01
            sha256: 0ede63515851d85ac0d1ed5f00e355f539968e6d1fd226120a27b2c66c3575de
          - type: patch
            path: patches/libxnvctrl_so_0.patch
      - name: glfw
        buildsystem: cmake-ninja
        config-opts:
          - -DGLFW_BUILD_EXAMPLES=BOOL=OFF
          - -DGLFW_BUILD_TESTS=BOOL=OFF
          - -DGLFW_BUILD_DOCS=BOOL=OFF
        sources:
          - type: git
            url: https://github.com/glfw/glfw.git
            tag: '3.4'
            commit: 7b6aead9fb88b3623e3b3725ebb42670cbe4c579
  # Application itself
  - name: twintaillauncher
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/twintaillauncher/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/twintaillauncher/flatpak-node/cache
        npm_config_cache: /run/build/twintaillauncher/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node20
        PNPM_STORE_PATH: /run/build/twintaillauncher/flatpak-node/cache/pnpm
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline --legacy-peer-deps # Can not use pnpm for this
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - /app/bin/pnpm --offline build:native --no-bundle # We need pnpm for building

      - install -Dm755 src-tauri/target/release/twintaillauncher /app/bin/twintaillauncher
      - install -Dm644 twintaillauncher.desktop /app/share/applications/app.twintaillauncher.ttl.desktop
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/app.twintaillauncher.ttl.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/app.twintaillauncher.ttl.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256@2/apps/app.twintaillauncher.ttl.png
      - install -Dm644 app.twintaillauncher.ttl.metainfo.xml /app/share/metainfo/app.twintaillauncher.ttl.metainfo.xml
      - install -Dm755 src-tauri/target/release/resources/winetricks /app/lib/twintaillauncher/resources/winetricks
      - install -Dm755 src-tauri/target/release/resources/reaper /app/lib/twintaillauncher/resources/reaper
      - install -Dm644 src-tauri/target/release/resources/hkrpg_patch.dll /app/lib/twintaillauncher/resources/hkrpg_patch.dll
      - cp -r src-tauri/target/release/resources/locales /app/lib/twintaillauncher/resources
      - install -Dm644 LICENSE /app/share/licenses/app.twintaillauncher.ttl/LICENSE
      - desktop-file-edit --set-icon=app.twintaillauncher.ttl /app/share/applications/app.twintaillauncher.ttl.desktop
    sources:
